<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Abli Code</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #060608; color: #fafafa; font-family: Inter, system-ui, sans-serif; }
  main { text-align: center; max-width: 420px; padding: 24px; }
  img { width: 64px; height: 64px; border-radius: 16px; }
  h1 { font-size: 28px; letter-spacing: -0.03em; margin: 22px 0 8px; }
  p { color: #a8a8b6; line-height: 1.6; margin: 0; }
  .bad { color: #ff2a43; }
</style>
</head>
<body>
<main>
  <img src="/icon.png" alt="" />
  <h1 id="title">Signing you in</h1>
  <p id="msg">One moment.</p>
</main>
<script>
(async () => {
  const title = document.getElementById('title');
  const msg = document.getElementById('msg');
  try {
    const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
    const query = new URLSearchParams(location.search);
    const problem = hash.get('error_description') || query.get('error_description');
    if (problem) throw new Error(problem);
    const accessToken = hash.get('access_token');
    const loginId = query.get('login');
    if (!accessToken || !loginId) throw new Error('Missing sign-in details. Start again from the Abli Code app.');
    history.replaceState(null, '', location.pathname);
    const res = await fetch('/api/auth/desktop/complete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ loginId, accessToken })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Sign-in failed.');
    title.textContent = 'You are signed in';
    msg.textContent = 'You can close this tab and go back to Abli Code.';
  } catch (e) {
    title.textContent = 'Sign-in failed';
    title.className = 'bad';
    msg.textContent = e.message;
  }
})();
</script>
</body>
</html>
